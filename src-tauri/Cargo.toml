[package]
name = "QuMaEditor"
version = "1.0.0"
description = "High Performance Native Markdown Editor Desktop Application"
authors = ["you"]
edition = "2021"

[lib]
name = "quma_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"

# 爆速ネイティブ処理クレート
encoding_rs = "0.8"         # Firefox採用の最高速文字コード検出・変換
pulldown-cmark = "0.12"     # 爆速 GFM Markdown パーサー
printpdf = "0.7"            # ブラウザ非依存のネイティブ PDF 直接出力
syntect = "5.2"             # ネイティブ高速構文ハイライト
similar = "2.6"             # 高速 Text Diff 差分計算エンジン
rayon = "1.10"              # マルチスレッド並列処理エンジン

[profile.release]
opt-level = 'z'     # サイズ最適化
lto = true          # リンク時最適化
codegen-units = 1   # コンパイル単位を1にして最適化を最大化
panic = 'abort'     # パニック時の巻き戻しを無効化して軽量化
strip = true        # シンボル情報を削除（サイズ大幅削減）
