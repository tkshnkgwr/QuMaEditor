[package]
name = "QuMaEditor"
version = "1.4.2"
description = "High-Performance Desktop Markdown Editor with Native Encoding Support"
authors = ["you"]
edition = "2021"
default-run = "QuMaEditor"

[lib]
name = "quma_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "QuMaEditor"
path = "src/main.rs"

[[bin]]
name = "gen_specta"
path = "src/bin/gen_specta.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"

# 爆速ネイティブ処理クレート
encoding_rs = "0.8"         # Firefox採用の最高速文字コード検出・変換
pulldown-cmark = "0.12"     # 爆速 GFM Markdown パーサー
printpdf = "0.7"            # ブラウザ非依存のネイティブ PDF 直接出力
syntect = "5.2"             # ネイティブ高速構文ハイライト
similar = "2.6"             # 高速 Text Diff 差分計算エンジン
rayon = "1.10"              # マルチスレッド並列処理エンジン
serde_yaml = "0.9"          # 高速・高信頼 YAML デシリアライズ
unicode-segmentation = "1.12" # 高速・高精度 Unicode 単語/文字境界走査
unicode-width = "0.2"         # 表組み垂直整列用の高精度 Unicode 表示幅計算
specta = { version = "=2.0.0-rc.20" }
specta-typescript = "0.0.7"
tauri-specta = { version = "=2.0.0-rc.20", features = ["javascript", "typescript"] }

[profile.release]
opt-level = 'z'     # サイズ最適化
lto = "thin"        # リンク時最適化 (thin によるビルド爆速化)
codegen-units = 16  # マルチスレッド並列コンパイルでビルド大幅短縮
panic = 'abort'     # パニック時の巻き戻しを無効化して軽量化
strip = true        # シンボル情報を削除（サイズ大幅削減）
